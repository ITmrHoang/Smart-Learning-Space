<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d6ff2" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Mất kết nối — Smart Learning Space</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef4ff;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #1d6ff2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --card: #1e293b;
          --text: #e5e7eb;
          --muted: #94a3b8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        border-radius: 16px;
        background: var(--card);
        box-shadow: 0 8px 30px rgb(0 0 0 / 8%);
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.3rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.6;
      }
      button {
        padding: 10px 22px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--primary) 40%, transparent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Không kết nối được tới Smart Learning Space. Hãy kiểm tra Wi-Fi hoặc dữ liệu di động — trang sẽ tự mở lại khi có mạng.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
    <script>
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
