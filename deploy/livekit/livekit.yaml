# LiveKit production (1 node). Khóa không nằm ở đây: đặt LIVEKIT_KEYS="<key>: <secret>" trong deploy/.env.
# Máy chạy LiveKit cần IP public + mở cổng 7881/tcp và 7882/udp (WebRTC). Caddy chuyển wss://<LIVEKIT_DOMAIN> vào cổng 7880.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
logging:
  level: info
room:
  empty_timeout: 600
  max_participants: 100
