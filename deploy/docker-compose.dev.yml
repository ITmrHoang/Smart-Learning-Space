# Hạ tầng cho môi trường dev. Chỉ mở cổng trên 127.0.0.1.
# Mật khẩu ở đây là giá trị dev, KHÔNG dùng cho production.
name: sls-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: sls
      POSTGRES_PASSWORD: sls_dev_password
      POSTGRES_DB: sls
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sls -d sls"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sls
      RABBITMQ_DEFAULT_PASS: sls_dev_password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672" # trang quản trị RabbitMQ
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # giao diện xem email
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Lưu file (tương thích S3). Sau lần `up` đầu tiên chạy: sh deploy/garage/init.sh
  garage:
    image: dxflrs/garage:v2.5.0
    environment:
      # File cấu hình mount từ Windows luôn "ai cũng đọc được" → cho phép khi dev.
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
    ports:
      - "127.0.0.1:3900:3900" # S3 API (Vite chuyển /files/* vào đây)
      - "127.0.0.1:3903:3903" # admin API
    volumes:
      - ./garage/garage.dev.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage

  # Phòng học trực tuyến (WebRTC SFU). Trình duyệt kết nối ws://127.0.0.1:7880.
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880" # API + WebSocket
      - "127.0.0.1:7881:7881" # WebRTC qua TCP
      - "127.0.0.1:7882:7882/udp" # WebRTC qua UDP
    volumes:
      - ./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro

volumes:
  pgdata:
  valkeydata:
  rabbitdata:
  garagedata:
